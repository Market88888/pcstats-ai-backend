<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCStats AI</title>
<style>
:root{--bg:#0b0d12;--card:#12151d;--line:#252b3a;--tx:#e8ebf4;--dim:#8d96ad;--acc:#8b6cff;--ok:#3ddc84;--bad:#ff5c6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:22px;margin:0 0 4px}.hint{color:var(--dim);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 6px}
input{width:100%;background:#0e111a;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px 14px;font:inherit}
input:focus{outline:none;border-color:var(--acc)}
button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),#6a8cff);width:100%;margin-top:12px}
button:disabled{opacity:.5}button.sec{background:#222839;margin-top:8px}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}
.status.ok{display:block;background:#1a3d2e;color:var(--ok)}.status.err{display:block;background:#3a1d26;color:var(--bad)}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#1e2333;font-size:12px;margin:4px 4px 0 0}
.pill.ok{color:var(--ok)}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#4fb4ff);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="card">
    <div class="logo">AI</div>
    <h1>PCStats AI</h1>
    <p class="hint">Вход в админку</p>
    <label>Пароль</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD">
    <button id="enter">Войти</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="logo">AI</div>
  <h1>Ключ ИИ</h1>
  <p class="hint" style="margin-bottom:16px">Вставь только API-ключ. Тип и модель определятся сами.<br>
  Groq: ключ <b>gsk_…</b> · OpenAI: ключ <b>sk-…</b></p>

  <div class="card">
    <label>API-ключ</label>
    <input id="key" type="password" placeholder="gsk_… или sk-…" autocomplete="off">
    <button id="save">Сохранить и проверить</button>
    <button class="sec" id="show">Показать / скрыть ключ</button>
    <div class="status" id="st"></div>
    <div id="info" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <p class="hint" id="meta"></p>
    <button class="sec" id="logout">Выйти</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let PW=sessionStorage.getItem('pw')||'';

async function api(path, body){
  const r=await fetch('/admin/api/'+path,{
    method: body?'POST':'GET',
    headers:{'x-admin-password':PW,'content-type':'application/json'},
    body: body?JSON.stringify(body):undefined
  });
  if(r.status===401){sessionStorage.removeItem('pw');location.reload();throw 0}
  return r.json();
}

async function load(){
  const ST=await api('state');
  $('#login').style.display='none';
  $('#app').style.display='';
  $('#meta').textContent='Хранилище: '+(ST.storage==='upstash'?'Redis (ключи не пропадут)':'файл (на Free могут пропасть после сна)');
  const box=$('#info');
  box.innerHTML='';
  if(!ST.providers.length){
    box.innerHTML='<span class="pill">ключей нет — вставь выше</span>';
    return;
  }
  for(const p of ST.providers){
    const act=ST.settings.activeProvider===p.id;
    box.innerHTML+=`<span class="pill ${p.hasKey?'ok':''}">${p.name} · ${p.model||'?'}${act?' · активный':''}${p.hasKey?' · '+p.keyMask:''}</span>`;
  }
}

$('#save').onclick=async()=>{
  const key=$('#key').value.trim();
  const st=$('#st');
  if(!key){st.className='status err';st.textContent='Вставь ключ';return}
  $('#save').disabled=true;
  st.className='status';st.style.display='block';st.textContent='Проверяю…';
  try{
    const r=await api('quick-key',{apiKey:key});
    if(r.ok){
      st.className='status ok';
      st.textContent='Готово! '+r.name+' · '+r.model+' · '+r.ms+' мс. Можно писать в игре.';
      $('#key').value='';
      await load();
    } else {
      st.className='status err';
      st.textContent='Ключ не принят: '+(r.error||'ошибка');
    }
  } catch(e){
    st.className='status err';st.textContent='Ошибка сети';
  }
  $('#save').disabled=false;
};

$('#show').onclick=()=>{
  const i=$('#key');
  i.type=i.type==='password'?'text':'password';
};

$('#enter').onclick=()=>{PW=$('#pw').value;sessionStorage.setItem('pw',PW);load().catch(()=>alert('Неверный пароль'))};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};
$('#logout').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
if(PW)load().catch(()=>{});
</script>
</body>
</html>

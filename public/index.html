<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCStats AI — админка</title>
<style>
:root{--bg:#0b0d12;--card:#12151d;--card2:#171b26;--line:#252b3a;--tx:#e8ebf4;--dim:#8d96ad;--acc:#8b6cff;--acc2:#4fb4ff;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5c6c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b1740 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800}
.pill{padding:3px 10px;border-radius:99px;background:#1e2333;color:var(--dim);font-size:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 4px}
input,select,textarea{width:100%;background:#0e111a;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:9px 11px;font:inherit;outline:none}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),#6a8cff)}
button.sec{background:#222839;color:var(--tx)}button.bad{background:#3a1d26;color:#ff9aa6}button.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.prov{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#0e111a}
.prov.active{border-color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block}.dot.on{background:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--dim)}
.bar{height:6px;background:#1e2333;border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc2))}
.toast{position:fixed;right:16px;bottom:16px;background:#1b2030;border:1px solid var(--line);padding:10px 14px;border-radius:12px;opacity:0;transition:.25s}
.toast.show{opacity:1}#login{max-width:340px;margin:18vh auto}.hint{color:var(--dim);font-size:12px;margin-top:6px}.sw{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="card">
    <div class="top"><div class="logo">AI</div><div><h1>PCStats AI</h1><div class="hint">Вход в админку</div></div></div>
    <label>Пароль администратора</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD">
    <div class="row" style="margin-top:12px"><button id="enter" style="width:100%">Войти</button></div>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
  <div class="top">
    <div class="logo">AI</div>
    <div><h1>PCStats AI — управление</h1><div class="hint" id="meta"></div></div>
    <div class="sp"></div>
    <button class="sec sm" id="logout">Выйти</button>
  </div>
  <div class="card">
    <h2>Общие настройки и лимиты</h2>
    <div class="grid g2">
      <div><label>Лимит сообщений в сутки (-1 = без лимита)</label><input id="defaultLimit" type="number"></div>
      <div><label>Часовой пояс сброса (UTC+)</label><input id="tzOffsetHours" type="number" step="0.5"></div>
      <div><label>Макс. длина сообщения</label><input id="maxInputChars" type="number"></div>
      <div><label>Макс. токенов ответа</label><input id="maxOutputTokens" type="number"></div>
      <div><label>Память диалога</label><input id="historyMessages" type="number"></div>
      <div><label>Креативность (0–1)</label><input id="temperature" type="number" step="0.1" min="0" max="1"></div>
    </div>
    <div class="sw" style="margin-top:12px"><input id="enabled" type="checkbox" style="width:auto"><span>ИИ включён</span></div>
    <label style="margin-top:12px">Системный промпт</label>
    <textarea id="systemPrompt"></textarea>
    <div class="row" style="margin-top:12px"><button id="saveSettings">Сохранить</button>
      <button class="sec" id="resetAll">Обнулить счётчики</button><span class="hint" id="reset"></span></div>
  </div>
  <div class="card">
    <div class="row"><h2 style="margin:0">API-ключи ИИ</h2><div class="sp"></div><button class="sec sm" id="addProv">+ Добавить</button></div>
    <div class="hint" style="margin:6px 0 12px">Ключи только на сервере. Активный — первый, остальные запасные.</div>
    <div id="provs"></div>
  </div>
  <div class="card">
    <div class="row"><h2 style="margin:0">Игроки</h2><div class="sp"></div><span class="hint">последние 300</span></div>
    <div style="overflow:auto"><table>
      <thead><tr><th>Ник</th><th>ID</th><th>Сегодня</th><th>Лимит</th><th>Всего</th><th></th></tr></thead>
      <tbody id="users"></tbody>
    </table></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let PW=sessionStorage.getItem('pw')||'',ST=null;
const esc=s=>String(s??'').replace(/[&<"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
async function api(path,body){
  const r=await fetch('/admin/api/'+path,{method:body?'POST':'GET',headers:{'x-admin-password':PW,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){sessionStorage.removeItem('pw');location.reload();throw 0}
  return r.json();
}
async function load(){
  ST=await api('state');
  $('#login').style.display='none';$('#app').style.display='';
  $('#meta').textContent='Хранилище: '+ST.storage;
  for(const k of ['defaultLimit','tzOffsetHours','maxInputChars','maxOutputTokens','historyMessages','temperature','systemPrompt'])$('#'+k).value=ST.settings[k];
  $('#enabled').checked=ST.settings.enabled;
  const h=Math.floor(ST.resetIn/3600),m=Math.floor(ST.resetIn%3600/60);$('#reset').textContent='Сброс через '+h+'ч '+m+'м';
  renderProvs();renderUsers();
}
function renderProvs(){
  const box=$('#provs');box.innerHTML='';
  if(!ST.providers.length)box.innerHTML='<div class="hint">Нет ключей. Нажми «+ Добавить».</div>';
  for(const p of ST.providers){
    const d=document.createElement('div');d.className='prov'+(ST.settings.activeProvider===p.id?' active':'');
    const opts=Object.keys(ST.types).map(t=>`<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`).join('');
    d.innerHTML=`<div class="row" style="margin-bottom:10px"><span class="dot ${p.enabled?'on':''}"></span><b>${esc(p.name||'Новый')}</b>
      ${ST.settings.activeProvider===p.id?'<span class="pill">активный</span>':''}<div class="sp"></div>
      <button class="sec sm" data-a="active">Активный</button><button class="sec sm" data-a="test">Проверить</button><button class="bad sm" data-a="del">Удалить</button></div>
    <div class="grid g2">
      <div><label>Название</label><input data-f="name" value="${esc(p.name)}"></div>
      <div><label>Тип</label><select data-f="type">${opts}</select></div>
      <div><label>Модель</label><input data-f="model" value="${esc(p.model)}"></div>
      <div><label>Base URL</label><input data-f="baseUrl" value="${esc(p.baseUrl)}"></div>
      <div><label>API-ключ</label><input data-f="apiKey" type="password" placeholder="${p.hasKey?'•••• оставь пустым':'вставь ключ'}"></div>
      <div class="sw" style="padding-top:18px"><input data-f="enabled" type="checkbox" style="width:auto" ${p.enabled?'checked':''}><span>Включён</span></div>
    </div><div class="row" style="margin-top:10px"><button data-a="save" class="sm">Сохранить</button><span class="hint" data-r></span></div>`;
    const get=()=>{const o={id:p.id};d.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.type==='checkbox'?e.checked:e.value);return o};
    d.addEventListener('click',async e=>{
      const a=e.target.dataset.a;if(!a)return;
      if(a==='save'){await api('provider',get());toast('OK');load()}
      if(a==='del'&&confirm('Удалить?')){await api('provider/delete',{id:p.id});load()}
      if(a==='active'){await api('settings',{activeProvider:p.id});load()}
      if(a==='test'){const r=d.querySelector('[data-r]');r.textContent='...';const x=await api('provider/test',{id:p.id});r.textContent=x.ok?'OK '+x.ms+'ms':'ERR '+x.error}
    });
    box.appendChild(d);
  }
}
$('#addProv').onclick=async()=>{await api('provider',{type:'openai',name:'New',enabled:true});load()};
$('#saveSettings').onclick=async()=>{
  const b={enabled:$('#enabled').checked,systemPrompt:$('#systemPrompt').value};
  for(const k of ['defaultLimit','tzOffsetHours','maxInputChars','maxOutputTokens','historyMessages','temperature'])b[k]=$('#'+k).value;
  await api('settings',b);toast('Сохранено');load();
};
$('#resetAll').onclick=async()=>{if(confirm('Сбросить?')){await api('reset-all',{});toast('OK');load()}};
function renderUsers(){
  const tb=$('#users');tb.innerHTML='';
  for(const u of ST.users){
    const lim=u.effectiveLimit,pct=lim<0?100:Math.min(100,u.used/Math.max(1,lim)*100);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(u.nick)||'—'} ${u.banned?'<span class="pill">бан</span>':''}</td><td class="hint">${esc(u.id.slice(0,10))}…</td>
    <td><div class="row"><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span>${u.used}/${lim<0?'∞':lim}</span></div></td>
    <td><input style="width:84px;padding:5px 8px" data-l value="${u.limit===null?'':u.limit}"></td><td>${u.total}</td>
    <td class="row"><button class="sec sm" data-a="lim">OK</button><button class="sec sm" data-a="ban">${u.banned?'Разбан':'Бан'}</button><button class="bad sm" data-a="rm">×</button></td>`;
    tr.addEventListener('click',async e=>{
      const a=e.target.dataset.a;if(!a)return;
      if(a==='lim')await api('user',{id:u.id,limit:tr.querySelector('[data-l]').value});
      if(a==='ban')await api('user',{id:u.id,banned:!u.banned});
      if(a==='rm'&&confirm('Удалить?'))await api('user',{id:u.id,remove:true});
      toast('OK');load();
    });
    tb.appendChild(tr);
  }
}
$('#enter').onclick=()=>{PW=$('#pw').value;sessionStorage.setItem('pw',PW);load().catch(()=>{})};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#enter').click()});
$('#logout').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
if(PW)load().catch(()=>{});
</script>
</body></html>

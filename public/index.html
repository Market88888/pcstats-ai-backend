<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCStats AI</title>
<style>
:root{--bg:#0b0d12;--card:#12151d;--line:#252b3a;--tx:#e8ebf4;--dim:#8d96ad;--acc:#8b6cff;--ok:#3ddc84;--bad:#ff5c6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:20px;margin:0}.hint{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 6px}
input,textarea{width:100%;background:#0e111a;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--acc),#6a8cff)}
button.sec{background:#222839}button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
.chat{height:320px;overflow:auto;background:#0a0c12;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.msg{max-width:90%;margin:8px 0;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#2a2150;margin-left:auto}.msg.ai{background:#1a2333}.msg.err{background:#3a1d26;color:var(--bad)}
.meta{font-size:11px;color:var(--dim);margin-top:4px}
.status{font-size:13px;margin-top:8px}.ok{color:var(--ok)}.err{color:var(--bad)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#4fb4ff);display:grid;place-items:center;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="card">
    <div class="logo">AI</div>
    <h1 style="margin-top:12px">PCStats AI</h1>
    <p class="hint">Вход</p>
    <label>Пароль</label>
    <input id="pw" type="password" placeholder="ADMIN_PASSWORD">
    <button id="enter" style="width:100%;margin-top:12px">Войти</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="row" style="margin-bottom:14px">
    <div class="logo">AI</div>
    <div class="sp"><h1>Тест ИИ</h1><div class="hint" id="meta"></div></div>
    <button class="sec" id="logout">Выйти</button>
  </div>

  <div class="card">
    <h1 style="font-size:15px;margin-bottom:8px">1. API-ключ</h1>
    <div class="hint" style="margin-bottom:8px">Groq <b>gsk_…</b> · OpenAI <b>sk-…</b> · Gemini <b>AIza…</b> / <b>AQ.…</b></div>
    <div class="row">
      <input id="quickKey" type="password" placeholder="вставь ключ" style="flex:1">
      <button id="quickSave">Сохранить</button>
    </div>
    <div class="status" id="quickSt"></div>
    <div id="provs" class="hint" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <h1 style="font-size:15px;margin:0">2. Чат с моделью</h1>
      <div class="sp"></div>
      <button class="sec" id="clearChat" style="padding:6px 10px;font-size:12px">Очистить</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input id="msg" placeholder="Напиши сообщение…" style="flex:1">
      <button id="send">Отправить</button>
    </div>
    <div class="status" id="chatSt"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let PW=sessionStorage.getItem('pw')||'';
let history=[];

async function api(path, body){
  const r=await fetch('/admin/api/'+path,{
    method: body?'POST':'GET',
    headers:{'x-admin-password':PW,'content-type':'application/json'},
    body: body?JSON.stringify(body):undefined
  });
  if(r.status===401){sessionStorage.removeItem('pw');location.reload();throw 0}
  return r.json();
}

function addMsg(role, text, meta){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}
  $('#chat').appendChild(d);
  $('#chat').scrollTop=$('#chat').scrollHeight;
}

async function load(){
  const ST=await api('state');
  $('#login').style.display='none';
  $('#app').style.display='';
  $('#meta').textContent='Хранилище: '+ST.storage;
  const box=$('#provs');
  if(!ST.providers.length) box.textContent='Ключей нет — вставь выше';
  else box.textContent=ST.providers.map(p=>p.name+' · '+(p.model||'?')+(p.hasKey?' · '+p.keyMask:' · нет ключа')+(ST.settings.activeProvider===p.id?' · активный':'')).join(' | ');
}

$('#quickSave').onclick=async()=>{
  const key=$('#quickKey').value.trim();
  const st=$('#quickSt');
  if(!key){st.className='status err';st.textContent='Вставь ключ';return}
  st.className='status';st.textContent='проверка…';
  const r=await api('quick-key',{apiKey:key});
  if(r.ok){st.className='status ok';st.textContent='OK: '+r.name+' · '+r.model+' · '+r.ms+' мс';$('#quickKey').value='';await load()}
  else {st.className='status err';st.textContent=r.error||'ошибка'}
};

async function send(){
  const text=$('#msg').value.trim();
  if(!text) return;
  $('#msg').value='';
  addMsg('user', text);
  $('#send').disabled=true;
  $('#chatSt').className='status';$('#chatSt').textContent='думает…';
  const r=await api('playground',{message:text, history});
  $('#send').disabled=false;
  if(r.ok){
    history.push({role:'user',content:text},{role:'assistant',content:r.answer});
    addMsg('ai', r.answer, (r.provider||'')+' · '+(r.model||'')+' · '+r.ms+' мс');
    $('#chatSt').textContent='';
  } else {
    addMsg('err', r.error||'ошибка');
    $('#chatSt').className='status err';
    $('#chatSt').textContent=r.error||'';
  }
}

$('#send').onclick=send;
$('#msg').onkeydown=e=>{if(e.key==='Enter')send()};
$('#clearChat').onclick=()=>{history=[];$('#chat').innerHTML=''};
$('#enter').onclick=()=>{PW=$('#pw').value;sessionStorage.setItem('pw',PW);load().catch(()=>alert('Неверный пароль'))};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};
$('#logout').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};
if(PW)load().catch(()=>{});
</script>
</body>
</html>
